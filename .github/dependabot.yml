version: 2
updates:
  # Enable version updates for npm packages in root
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    reviewers:
      - 'boussadjra'
    assignees:
      - 'boussadjra'

  # Enable version updates for npm packages in core-utils
  - package-ecosystem: 'npm'
    directory: '/packages/core-utils'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(core-utils)'
      include: 'scope'
    reviewers:
      - 'boussadjra'

  # Enable version updates for npm packages in vue
  - package-ecosystem: 'npm'
    directory: '/packages/vue'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(vue)'
      include: 'scope'
    reviewers:
      - 'boussadjra'

  # Enable version updates for npm packages in docs
  - package-ecosystem: 'npm'
    directory: '/docs'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(docs)'
      include: 'scope'

  # Enable version updates for npm packages in playground
  - package-ecosystem: 'npm'
    directory: '/playground/vue3'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(playground)'
      include: 'scope'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
