version: 2

# One entry per workspace package would be thirteen near-identical blocks, and
# they would drift as packages are added. `directories` with a glob covers the
# whole workspace, and grouping keeps a framework bump to a single PR rather
# than one per package.
updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/packages/*'
      - '/playground/*'
      - '/legacy/*'
      - '/docs'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    reviewers:
      - 'boussadjra'
    groups:
      vue:
        patterns: ['vue', 'vue-*', '@vue/*', '@vitejs/plugin-vue', 'unplugin-vue']
      react:
        patterns: ['react', 'react-dom', '@types/react*', '@vitejs/plugin-react']
      svelte:
        patterns: ['svelte', 'svelte-*', '@sveltejs/*']
      solid:
        patterns: ['solid-js', 'vite-plugin-solid', '@solidjs/*']
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@analogjs/*']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/*', '@axe-core/*', '@testing-library/*', 'jsdom']
      build:
        patterns: ['vite', 'vite-plus', 'tsdown', 'typescript', 'publint', '@arethetypeswrong/*']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
