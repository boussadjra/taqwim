name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    if: github.repository == 'boussadjra/taqwim'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vite+
        run: curl -fsSL https://vite.plus/install | bash

      - name: Check formatting and lint
        run: pnpm exec vp check

      - name: Check types
        run: pnpm exec vp run -r type-check

      - name: Build packages and apps
        run: pnpm exec vp run -r build

      - name: Run unit tests
        run: pnpm exec vp run -r test

      - name: Check core coverage
        run: pnpm exec vp run -F @taqwim/core -F @taqwim/calendar-core test:coverage

      - name: Check package exports
        run: pnpm exec vp run -r verify-package

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run shared browser tests
        run: pnpm exec playwright test

      - name: Build documentation
        run: pnpm exec vp run -F taqwim-docs build

  publish:
    name: Publish packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vite+
        run: curl -fsSL https://vite.plus/install | bash

      - name: Use npm with trusted publishing support
        run: npm install --global npm@latest

      - name: Build packages
        run: pnpm exec vp run -r build

      - name: Check package exports
        run: pnpm exec vp run -r verify-package

      # Enable only after every @taqwim/* package trusts this workflow and the
      # release environment on npm. The script resumes any partial publish.
      - name: Publish exact versions to npm
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: pnpm publish:packages
        env:
          NPM_CONFIG_PROVENANCE: 'true'
