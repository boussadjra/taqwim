name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # `vp install` shells out to pnpm, which refuses to purge node_modules
  # without a TTY unless CI is set.
  CI: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is EOL and the packages now require >=20.
        node-version: [20, 22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Vite+
        run: curl -fsSL https://vite.plus | bash

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint and types
        run: pnpm exec vp check

      - name: Type check
        run: pnpm exec vp run -r type-check

      - name: Build all packages
        run: pnpm exec vp run -r build

      - name: Test
        run: pnpm exec vp run -r test

      - name: Coverage
        if: matrix.node-version == 22
        run: pnpm exec vp run -F @taqwim/core test:coverage

      - name: Install Playwright browsers
        run: pnpm --filter taqwim-vue exec playwright install --with-deps

      - name: Run E2E tests with Playwright
        run: pnpm exec vp run -r test:e2e

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: packages/vue/playwright-report/
          retention-days: 7

      - name: Build Documentation
        run: pnpm exec vp run -F taqwim-docs docs:build

      - name: Upload coverage to Codecov
        if: matrix.node-version == 22
        uses: codecov/codecov-action@v4
        with:
          directory: ./packages/core/coverage
          fail_ci_if_error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level moderate

      - name: Run license check
        run: npx license-checker --onlyAllow 'MIT;Apache-2.0;BSD-3-Clause;BSD-2-Clause;ISC;0BSD'
