name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # `vp install` shells out to pnpm, which refuses to purge node_modules
  # without a TTY unless CI is set.
  CI: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pnpm 11 requires Node 22.13+. Node 20 checks the built artifact below.
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Vite+
        run: curl -fsSL https://vite.plus | bash

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint and types
        run: pnpm exec vp check

      - name: Type check
        run: pnpm exec vp run -r type-check

      - name: Build all packages
        run: pnpm exec vp run -r build

      - name: Test
        run: pnpm exec vp run -r test

      - name: Coverage
        if: matrix.node-version == 22
        # The two packages where a bug is silent: the date math and the state
        # machine. Both gate at 80% in their own vite.config.ts.
        run: pnpm exec vp run -F @taqwim/core -F @taqwim/calendar-core test:coverage

      - name: Verify what would be published
        # publint and attw across all thirteen packages. An export-map mistake is
        # the likeliest shipping bug and nothing else catches one.
        run: pnpm exec vp run -r verify-package

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the shared cross-framework E2E suite
        # One spec directory, run against every framework playground. See
        # e2e/KNOWN-GAPS.md for adapters that are not yet in the default run.
        run: pnpm exec playwright test

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 7

      - name: Build the documentation site
        run: pnpm exec vp run -F taqwim-docs build

      - name: Check whether Codecov is configured
        if: matrix.node-version == 22
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codecov
        # The coverage gate above is required; this external upload is optional
        # until a Codecov token is configured for the repository.
        if: steps.codecov.outputs.configured == 'true'
        uses: codecov/codecov-action@v7
        with:
          directory: ./packages/core/coverage
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  node-20:
    name: Node 20 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24 for the build toolchain
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vite+
        run: curl -fsSL https://vite.plus | bash

      - name: Build core
        run: pnpm exec vp run -F @taqwim/core build

      - name: Switch to Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Check the built ESM and CommonJS packages
        run: |
          node --version
          node packages/core/runtimes/esm.mjs "file://${GITHUB_WORKSPACE}/packages/core/dist/index.mjs" "file://${GITHUB_WORKSPACE}/packages/core/dist/calendars/islamic-civil.mjs" "file://${GITHUB_WORKSPACE}/packages/core/dist/calendars/islamic-tbla.mjs"
          node packages/core/runtimes/cjs.cjs "$GITHUB_WORKSPACE/packages/core/dist/index.cjs" "$GITHUB_WORKSPACE/packages/core/dist/calendars/islamic-civil.cjs" "$GITHUB_WORKSPACE/packages/core/dist/calendars/islamic-tbla.cjs"

  runtimes:
    # @taqwim/core has no DOM, no `node:` imports and no framework, so it is
    # meant to run wherever a `Date` does. The `test` job only ever proves that
    # for Node — this one runs the built package under Deno and Bun as well.
    # It is a separate job because it needs those two toolchains installed and
    # nothing else in the matrix does.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Vite+
        run: curl -fsSL https://vite.plus | bash

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the conformance checks under every runtime
        # Builds @taqwim/core first, then runs packages/core/runtimes against
        # dist/ in each runtime, module format and time zone. CI is set here,
        # so a runtime that failed to install is a failure rather than a skip.
        run: pnpm exec vp run -F @taqwim/core test:runtimes

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level moderate

      - name: Run license check
        # The private workspace root is not distributed. The accessibility
        # test helper @axe-core/playwright declares MPL-2.0.
        run: npx license-checker --excludePrivatePackages --onlyAllow 'MIT;Apache-2.0;BSD-3-Clause;BSD-2-Clause;ISC;0BSD;MPL-2.0'
