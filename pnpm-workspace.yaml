packages:
  - packages/*
  - playground/*
  - docs
  - legacy/*

allowBuilds:
  # ng-packagr's file watcher. Native build, and only used in watch mode —
  # the library build is a one-shot `ngc` invocation.
  '@parcel/watcher': false
  esbuild: true
  # @angular/build's on-disk compilation cache. Native builds, and the library
  # build is a one-shot `ngc` invocation that never touches it.
  lmdb: false
  msgpackr-extract: false
  # Astro's image pipeline. Native, and the docs build needs it.
  sharp: true
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-hp3w-g68c-fv3c
minimumReleaseAgeExclude:
  # Angular 21 is newer than the workspace's minimum-release-age policy allows.
  # Listed explicitly so the exception is reviewable rather than silent.
  - '@angular/build'
  - '@angular/common'
  - '@angular/compiler'
  - '@angular/compiler-cli'
  - '@angular/core'
  - '@angular/platform-browser'
  - '@angular-devkit/architect'
  - '@angular-devkit/core'
  - 'ng-packagr'
  # Fresh security patches are deliberately allowed through the age policy.
  - markdown-it@14.3.1
  - brace-expansion@1.1.21 || 2.1.7 || 5.0.12
  - piscina@5.3.2
  - probe-image-size@7.4.0
  - http-cache-semantics@4.3.0
  - seroval@1.6.3
  - source-map-js@1.2.2
  - postcss-selector-parser@7.1.6
  - '@vue/server-renderer@3.5.42'
  - vue@3.5.42
  - tinypool@2.1.2
  - sharp@0.35.5

# Resolve vulnerable transitive packages to patched versions. Keep separate
# brace-expansion major lines because their consumers use different APIs.
overrides:
  '@vue/server-renderer@<3.5.42': 3.5.42
  'vue@>=3.5.0 <3.5.42': 3.5.42
  'brace-expansion@<2.0.0': 1.1.21
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.7
  'brace-expansion@>=4.0.0 <6.0.0': 5.0.12
  'diff@4.0.2': 4.0.4
  'http-cache-semantics@<=4.2.0': 4.3.0
  'js-yaml@3.14.1': 3.15.2
  'lodash@4.17.21': ^4.17.24
  'markdown-it@<14.3.1': 14.3.1
  'mdast-util-to-hast@13.2.0': 13.2.1
  'minimatch@3.1.2': 3.1.4
  'piscina@>=5.0.0 <5.3.2': 5.3.2
  'postcss-selector-parser@<7.1.6': 7.1.6
  'probe-image-size@<=7.3.0': 7.4.0
  'seroval@<=1.6.2': 1.6.3
  'sharp@<0.35.5': 0.35.5
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'tinypool@<2.1.2': 2.1.2
  'tmp@0.0.33': 0.2.7
